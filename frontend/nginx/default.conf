# nginx: punto de entrada unico de ClinicaCore.
# - Sirve el SPA (React + React Router) con fallback a index.html.
# - Hace reverse-proxy de /api -> Gateway (servicio 'gateway' :5000 en la red del stack).
# - /healthz responde 200 para health checks del orquestador.
#
# NOTA: esta es la copia que consume frontend/Dockerfile (contexto de build = frontend/).
# Debe mantenerse identica a infra/nginx/default.conf (copia canonica de infra, ver FEAT-002).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (React Router en cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy al Gateway. Mismo origen que el SPA, sin CORS.
    # El upstream se resuelve en tiempo de peticion (variable + resolver) para que
    # nginx arranque aunque el servicio 'gateway' aun no exista (p. ej. smoke test
    # del contenedor web solo). En el stack, Docker DNS (127.0.0.11) resuelve 'gateway'.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_gateway gateway;
        # Con proxy_pass por variable, nginx no reescribe el URI: se reenvia
        # $request_uri tal cual (incluye el prefijo /api/, que el Gateway espera).
        proxy_pass http://$upstream_gateway:5000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check del contenedor web.
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
