# Stack de despliegue de ClinicaCore (Docker Swarm, compose v3).
# Un solo nodo: la alta disponibilidad es a nivel de contenedor (replicas + reinicio),
# no a nivel de maquina (ver infra/mysql/PROMOCION.md).
#
# Orquestacion con infra/scripts/00..07. Imagenes de FEAT-001:
#   clinicacore-web, clinicacore-gateway, clinicacore-api (+ clinicacore-migrator de FEAT-002).
# Secrets externos (se crean con infra/scripts/01-crear-secrets.sh; NUNCA van en el repo):
#   mysql_root_password, mysql_app_password, mysql_repl_password, jwt_secret.
version: "3.8"

services:
  # --- Punto de entrada unico: SPA + reverse-proxy /api -> gateway ---
  nginx:
    image: clinicacore-web:local
    ports:
      # 8090 en el host (el 8080 lo ocupa otro proyecto, taskmanager-api).
      - "8090:80"
    networks:
      - clinicacore-net
    healthcheck:
      # nginx:alpine trae wget (BusyBox), no curl. 127.0.0.1 explicito: en Alpine
      # 'localhost' resuelve antes a ::1 (IPv6) y nginx solo escucha en IPv4, lo que
      # haria fallar el healthcheck con 'connection refused'.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        order: start-first

  # --- Gateway (BFF). Debe llamarse 'gateway': el nginx hace proxy_pass a ese nombre ---
  gateway:
    image: clinicacore-gateway:local
    networks:
      - clinicacore-net
    environment:
      CLINICACORE_Services__ApiBaseUrl: "http://api:5080"
    secrets:
      - jwt_secret
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        order: start-first

  # --- Api (servicio de dominio). Habla con el primario MySQL ---
  api:
    image: clinicacore-api:local
    networks:
      - clinicacore-net
    environment:
      # Cadena base SIN password; el entrypoint le anade Password=<secret mysql_app_password>.
      CLINICACORE_ConnectionStrings__ClinicaCore: "Server=mysql-primary;Port=3306;Database=clinicacore;User=clinicacore;"
    secrets:
      - jwt_secret
      - mysql_app_password
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: 2
      restart_policy:
        condition: any
      update_config:
        order: start-first

  # --- MySQL primario (lectura/escritura) ---
  mysql-primary:
    image: mysql:8.0
    command:
      - "--default-authentication-plugin=caching_sha2_password"
    networks:
      - clinicacore-net
    environment:
      MYSQL_DATABASE: clinicacore
      MYSQL_USER: clinicacore
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
      # Variables propias usadas por el init del primario (00-aplicar-plantilla.sh).
      MYSQL_REPL_USER: repl
      MYSQL_REPL_PASSWORD_FILE: /run/secrets/mysql_repl_password
    secrets:
      - mysql_root_password
      - mysql_app_password
      - mysql_repl_password
    volumes:
      - mysql-primary-data:/var/lib/mysql
      - ./mysql/primary/my.cnf:/etc/mysql/conf.d/replicacion.cnf:ro
      - ./mysql/primary/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # --- MySQL replica (solo lectura; sigue al primario) ---
  mysql-replica:
    image: mysql:8.0
    command:
      - "--default-authentication-plugin=caching_sha2_password"
    networks:
      - clinicacore-net
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # Nombre de la BD de la aplicacion: la replica la crea localmente antes de
      # arrancar la replicacion (el CREATE DATABASE del primario no viaja por binlog).
      MYSQL_DATABASE: clinicacore
      # Datos de conexion al primario para el init de la replica.
      MYSQL_PRIMARY_HOST: mysql-primary
      MYSQL_PRIMARY_PORT: "3306"
      MYSQL_REPL_USER: repl
      MYSQL_REPL_PASSWORD_FILE: /run/secrets/mysql_repl_password
    secrets:
      - mysql_root_password
      - mysql_repl_password
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./mysql/replica/my.cnf:/etc/mysql/conf.d/replicacion.cnf:ro
      - ./mysql/replica/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # --- Migrator de un solo uso: NO arranca con el stack (replicas 0) ---
  # Se dispara aparte con infra/scripts/04-migrar.sh, que lo corre una vez y espera su salida.
  migrator:
    image: clinicacore-migrator:local
    networks:
      - clinicacore-net
    environment:
      CLINICACORE_ConnectionStrings__ClinicaCore: "Server=mysql-primary;Port=3306;Database=clinicacore;User=clinicacore;"
    secrets:
      - mysql_app_password
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none
      placement:
        constraints:
          - node.role == manager

networks:
  clinicacore-net:
    driver: overlay
    internal: true
    attachable: true

volumes:
  mysql-primary-data:
  mysql-replica-data:

secrets:
  mysql_root_password:
    external: true
  mysql_app_password:
    external: true
  mysql_repl_password:
    external: true
  jwt_secret:
    external: true
